<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拉丝 · 夜光画室 60 秒</title>
<style>
  :root{
    --lime:#C6F24E; --pink:#FF8FA8; --cyan:#57E0FF; --ink:#07020f;
    --muted:#8d7fb0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(900px 600px at 50% 20%,#150a2c 0%,#06010d 70%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:#efe8ff;}
  #app{position:relative;width:min(96vw,calc(94vh * 16 / 9));aspect-ratio:16/9;
    border-radius:20px;overflow:hidden;background:#05010c;
    box-shadow:0 30px 100px rgba(0,0,0,.8),0 0 0 1px rgba(198,242,78,.10),0 0 90px rgba(120,60,220,.16);}
  #stage{position:absolute;inset:0}
  #stage canvas{display:block;width:100%!important;height:100%!important}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 45%,rgba(3,0,10,.55) 78%,rgba(3,0,10,.9) 100%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.6'/></svg>")}
  .hud{position:absolute;inset:0;pointer-events:none;padding:22px 26px;display:flex;justify-content:space-between;align-items:flex-start}
  .title{font-size:20px;font-weight:800;letter-spacing:1px;color:#E9FFB0;text-shadow:0 0 20px rgba(198,242,78,.5)}
  .title span{display:block;margin-top:2px;font-size:10.5px;font-weight:500;letter-spacing:2.5px;color:rgba(255,255,255,.45)}
  .right{text-align:right}
  .timer{font:700 34px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;color:#fff;text-shadow:0 0 24px rgba(255,255,255,.3)}
  .timer.warn{color:#FF8FA8;text-shadow:0 0 24px rgba(255,143,168,.6)}
  .pizza{margin-top:8px;font:600 13px/1.4 ui-monospace,monospace;letter-spacing:1px;color:rgba(255,255,255,.55)}
  .pizza b{color:#FFC94A}
  .stars{margin-top:4px;font-size:26px;letter-spacing:6px;color:#FFC94A;text-shadow:0 0 24px rgba(255,201,74,.5)}
  .hint{margin-top:6px;font-size:11px;letter-spacing:.5px;color:rgba(255,255,255,.42)}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;background:rgba(4,1,12,.72);backdrop-filter:blur(6px);transition:opacity .35s;pointer-events:auto}
  .overlay.hidden{opacity:0;pointer-events:none}
  .overlay h1{margin:0;font-size:64px;font-weight:900;letter-spacing:4px;color:var(--lime);
    text-shadow:0 0 34px rgba(198,242,78,.55),0 0 80px rgba(198,242,78,.25)}
  .overlay h2{margin:0;font-size:30px;font-weight:800;color:#fff}
  .overlay p{margin:0;font-size:14px;letter-spacing:3px;color:var(--muted)}
  .keys{display:flex;gap:26px;margin:10px 0 4px;flex-wrap:wrap;justify-content:center}
  .keys div{font-size:12px;color:rgba(255,255,255,.55);letter-spacing:.5px}
  .keys b{display:inline-block;min-width:26px;padding:4px 7px;margin:0 2px;border-radius:6px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;font:600 12px/1.2 ui-monospace,monospace;text-align:center}
  .go{margin-top:10px;padding:11px 26px;border-radius:999px;background:var(--lime);color:#16082f;
    font-weight:800;font-size:14px;letter-spacing:2px;border:0;cursor:pointer;box-shadow:0 0 30px rgba(198,242,78,.35)}
  .go:hover{transform:translateY(-1px)}
  .stat{margin-top:2px;font:600 13px/1.6 ui-monospace,monospace;color:rgba(255,255,255,.6)}
  .tension{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:220px;height:6px;
    border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;opacity:.55;transition:opacity .2s}
  .tension.hot{opacity:1}
  .tension i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#C6F24E,#FFFFFF)}
  .toast{position:absolute;left:50%;top:118px;transform:translateX(-50%);padding:9px 18px;border-radius:999px;
    background:rgba(10,4,24,.72);border:1px solid rgba(198,242,78,.25);color:#E9FFB0;font-size:14px;
    letter-spacing:1px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .debug{position:absolute;left:14px;bottom:14px;width:252px;padding:12px;border-radius:12px;
    background:rgba(8,3,18,.9);border:1px solid rgba(255,255,255,.12);
    font:11px/1.6 ui-monospace,monospace;color:#cfc4ea;display:none;pointer-events:auto}
  .debug.on{display:block}
  .debug label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0;color:#9a8fb8}
  .debug input[type=range]{width:108px;accent-color:#C6F24E}
  .debug .row{display:flex;gap:6px;margin-top:8px}
  .debug button{flex:1;padding:5px 4px;border-radius:6px;border:1px solid rgba(198,242,78,.3);
    background:rgba(198,242,78,.08);color:#dfe9c0;font:600 10px/1.2 inherit;cursor:pointer}
  .hitflash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .12s;
    background:radial-gradient(120% 90% at 50% 50%,rgba(255,60,110,0) 40%,rgba(255,40,90,.55) 100%)}
  @keyframes breathe{0%,100%{text-shadow:0 0 34px rgba(198,242,78,.42),0 0 80px rgba(198,242,78,.18)}
    50%{text-shadow:0 0 52px rgba(198,242,78,.75),0 0 120px rgba(198,242,78,.3)}}
  .overlay h1{animation:breathe 3.4s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes pop{0%{transform:scale(1.5);opacity:0}35%{opacity:1}100%{transform:scale(1);opacity:1}}
  .cd-num{font:900 150px/1 ui-monospace,monospace;color:#C6F24E;
    text-shadow:0 0 50px rgba(198,242,78,.6),0 0 120px rgba(198,242,78,.35);animation:pop .45s ease-out}
  .lc-kicker{font:700 12px/1 ui-monospace,monospace;letter-spacing:6px;color:#C6F24E;opacity:.8}
  .lc-title{font-size:42px;font-weight:900;letter-spacing:4px;margin:6px 0 2px;color:#fff}
  .lc-sub{font-size:14px;letter-spacing:2px;color:#9a8fb8}
  .rank{font:900 84px/1 ui-monospace,monospace;color:#C6F24E;
    text-shadow:0 0 40px rgba(198,242,78,.55);animation:pop .5s ease-out}
  .best{margin-top:2px;font:600 12px/1.6 ui-monospace,monospace;letter-spacing:1px;color:#FFC94A}
  .pauseBtns{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center}
  .pauseBtns button,.ghost{padding:9px 18px;border-radius:999px;border:1px solid rgba(198,242,78,.28);
    background:rgba(198,242,78,.07);color:#dfe9c0;font:700 13px/1.2 inherit;letter-spacing:1px;cursor:pointer}
  .pauseBtns button:hover,.ghost:hover{background:rgba(198,242,78,.16)}
  .ghost{margin-top:8px;font-size:12px;color:#9a8fb8;border-color:rgba(255,255,255,.14);background:transparent}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="hitflash" id="hitflash"></div>
  <div class="tension" id="tension"><i></i></div>
  <div class="toast" id="toast"></div>

  <div class="debug" id="debug">
    <div>FPS <b id="fps">0</b> · 按 ` 关闭</div>
    <label>重力 <input id="sGrav" type="range" min="1200" max="2800" step="10" value="1950"></label>
    <label>跳跃 <input id="sJump" type="range" min="600" max="1200" step="10" value="880"></label>
    <label>绳刚度 <input id="sK" type="range" min="4" max="24" step="1" value="10"></label>
    <label>曝光 <input id="sExp" type="range" min="50" max="130" step="1" value="92"></label>
    <label>Bloom <input id="sBloom" type="range" min="0" max="100" step="1" value="55"></label>
    <div class="row">
      <button id="copyTune">复制参数</button>
      <button id="dlLog">下载日志</button>
      <button id="muteBtn">静音</button>
    </div>
  </div>

  <div class="hud">
    <div class="title">拉丝<span>第 1 关 · 夜光画室</span></div>
    <div class="right">
      <div class="timer" id="timer">60.0</div>
      <div class="pizza" id="pizza">披萨 <b>0</b> / 3</div>
      <div class="hint">A/D · W · F　｜　←/→ · ↑ · J</div>
    </div>
  </div>

  <div class="overlay" id="start">
    <h1>拉丝</h1>
    <p>第 1 关 · 夜光画室</p>
    <div class="keys">
      <div><b>A</b><b>D</b> 移动　<b>W</b> 跳　<b>F</b> 拉绳</div>
      <div><b>←</b><b>→</b> 移动　<b>↑</b> 跳　<b>J</b> 拉绳</div>
    </div>
    <div class="stat">偷到披萨，两个人一起到终点</div>
    <button class="go" id="go">空格开始</button>
    <div class="stat" style="opacity:.45;font-size:11px;margin-top:10px">60 秒 · 双人 · 可单人 + AI</div>
  </div>

  <div class="overlay hidden" id="levelCard">
    <div class="lc-kicker">LEVEL 01</div>
    <div class="lc-title">夜光画室</div>
    <div class="lc-sub">偷到披萨，两个人一起到终点</div>
  </div>

  <div class="overlay hidden" id="countdown">
    <div class="cd-num" id="cdNum">3</div>
  </div>

  <div class="overlay hidden" id="pause">
    <h2>暂停</h2>
    <div class="stat">Esc 继续</div>
    <div class="pauseBtns">
      <button id="resumeBtn">继续</button>
      <button id="restartBtn">重开</button>
      <button id="muteBtn2">静音</button>
      <button id="titleBtn">回标题</button>
    </div>
  </div>

  <div class="overlay hidden" id="end">
    <div class="rank" id="rank">A</div>
    <h2 id="endTitle">逃出来了</h2>
    <div class="stars" id="endStars">★★★</div>
    <div class="stat" id="endStat"></div>
    <div class="best" id="bestLine"></div>
    <button class="go" id="again">R 再来一局</button>
    <button class="ghost" id="toTitle">回标题</button>
  </div>
</div>

<script>
  window.addEventListener('error', function (e) {
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:12px;bottom:12px;max-width:70vw;padding:10px 14px;border-radius:8px;background:rgba(120,10,30,.92);color:#ffd7e0;font:12px/1.5 ui-monospace,monospace;z-index:9999;white-space:pre-wrap';
    box.textContent = '出错：' + (e.message || e.type);
    document.body.appendChild(box);
  });
</script>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/addons/"
  }
}
</script>
<script type="module" src="three-demo.js"></script>
</body>
</html>
